name: Bug report
description: Report a reproducible problem
title: "[bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps and a minimal fixture
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and version
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
