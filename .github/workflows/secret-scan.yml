name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject high-confidence provider and private-key patterns
        shell: bash
        run: |
          if git grep -n -E 'sk-[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC) PRIVATE KEY-----|AIza[0-9A-Za-z_-]{20,}'; then
            echo "Potential secret found" >&2
            exit 1
          fi
